plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0-M3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
	id 'com.github.ben-manes.versions' version '0.53.0'
	id 'jacoco'
}

group = 'com.obsidianforge'
version = '0.0.1-SNAPSHOT'
description = 'The Tabletop Simulator APIs'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

ext {
	set('springCloudVersion', "2025.1.0-M4")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation "io.swagger:swagger-codegen-maven-plugin:2.4.48"
	
	compileOnly 'org.projectlombok:lombok'
	
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	
	annotationProcessor 'org.projectlombok:lombok'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
	testImplementation 'org.springframework.graphql:spring-graphql-test'
	testImplementation 'org.springframework.security:spring-security-test'
	
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	configurations.all {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.register('generateSwaggerCode') {
	group = 'build'
	description = 'Generates code from the Swagger definition.'

	// Path to the OpenAPI specification file
	def inputSpec = file('src/main/resources/swagger/api.yaml').absolutePath

	// Output directory for the generated code
	def outputDir = file("$buildDir/generated-sources/swagger")

	// Command to execute Swagger Codegen
	commandLine 'java', '-jar', 'path/to/swagger-codegen-cli.jar',
                'generate',
                '-i', inputSpec,
                '-l', 'java',
                '-o', outputDir

    // Ensure the output directory exists
    doFirst {
        outputDir.mkdirs()
    }
}

sourceSets.main.java.srcDirs += file("$buildDir/generated-sources/swagger/src/main/java")

tasks.named('test') {
	useJUnitPlatform()
}
